name: Deploy Secrets To Server
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets naar server schrijven
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # .env server-side aanmaken; waarden gaan via stdin, komen nooit in de log
          {
            echo "SCRAPE_DO_TOKEN=$SCRAPE_DO_TOKEN"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes botsauto@"$HOST" \
              'umask 077 && cat > /home/botsauto/app/auto-alert/.env && echo "GESCHREVEN: $(wc -l < /home/botsauto/app/auto-alert/.env) regels"'

          # controle: alleen sleutelnamen tonen, nooit waarden
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes botsauto@"$HOST" \
            'echo "--- controle ---"; ls -l /home/botsauto/app/auto-alert/.env; grep -oE "^[A-Z_]+=" /home/botsauto/app/auto-alert/.env; \
             for v in SCRAPE_DO_TOKEN ANTHROPIC_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do \
               n=$(grep -c "^$v=." /home/botsauto/app/auto-alert/.env); \
               echo "$v gevuld: $n"; done'
