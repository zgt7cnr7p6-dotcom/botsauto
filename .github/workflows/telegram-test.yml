name: Telegram Test
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Testbericht sturen
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "Secret ontbreekt (token of chat-id leeg)"; exit 1; fi
          resp=$(curl -s "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=✅ Testbericht van je auto-alert bot — Telegram werkt! ($(date -u +'%Y-%m-%d %H:%M UTC'))")
          echo "Telegram-antwoord: $resp"
          echo "$resp" | grep -q '"ok":true' && echo "== VERZONDEN ==" || { echo "== MISLUKT =="; exit 1; }
