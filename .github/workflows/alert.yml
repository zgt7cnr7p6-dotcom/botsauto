name: Auto Alert Scraper

on:
  schedule:
    # Elke 5 minuten, alleen 07:00-18:00 UTC (= 08:00-19:00 CET)
    - cron: '*/5 7-18 * * *'
  workflow_dispatch:
    inputs:
      clear_db:
        description: 'Database wissen (volledige nieuwe scan)'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

defaults:
  run:
    working-directory: auto-alert

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi patchright
          patchright install chromium
          patchright install-deps chromium

      - name: Restore database from cache
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clear_db == false) }}
        uses: actions/cache/restore@v4
        with:
          path: auto-alert/listings.db
          key: listings-db-dummy
          restore-keys: |
            listings-db-

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper.py

      - name: Save database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: auto-alert/listings.db
          key: listings-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload debug HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: auto-alert/debug_*.html
          retention-days: 3
          if-no-files-found: ignore
