name: Auto Alert Scraper

on:
  schedule:
    # Elke 5 minuten draaien
    - cron: '*/5 * * * *'
  workflow_dispatch: # Handmatig triggeren mogelijk

permissions:
  actions: write
  contents: read

defaults:
  run:
    working-directory: auto-alert

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Download database
        uses: dawidd6/action-download-artifact@v6
        with:
          name: listings-db
          path: auto-alert
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper.py

      - name: Upload database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listings-db
          path: auto-alert/listings.db
          retention-days: 90
          overwrite: true

      - name: Upload debug screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshots
          path: |
            auto-alert/debug_*.png
            auto-alert/debug_*.html
            auto-alert/debug_*.json
          retention-days: 3
          if-no-files-found: ignore
