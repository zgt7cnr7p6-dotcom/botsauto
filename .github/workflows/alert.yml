name: Auto Alert Scraper

on:
  # Scheduling via cron-job.org (elke 3 min, workflow_dispatch trigger)
  # GitHub's eigen cron is uitgeschakeld — cron-job.org is betrouwbaarder
  # en ondersteunt intervals < 5 min.
  workflow_dispatch:
    inputs:
      clear_db:
        description: 'Database wissen (volledige nieuwe scan — TRIGGERT ALERTS VOOR ALLE LISTINGS!)'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

defaults:
  run:
    working-directory: auto-alert

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: scraper-run
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Restore database from cache
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clear_db == false) }}
        uses: actions/cache/restore@v4
        with:
          path: auto-alert/listings.db
          key: listings-db-dummy
          restore-keys: |
            listings-db-

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py 2>&1 | tee scraper_output.log

      - name: Post log summary as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f scraper_output.log ]; then
            SUMMARY=$(tail -200 scraper_output.log | head -c 60000)
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
              -f body="### Run #${{ github.run_number }} — $(date -u +'%Y-%m-%d %H:%M UTC')
          \`\`\`
          ${SUMMARY}
          \`\`\`"
          fi

      - name: Save database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: auto-alert/listings.db
          key: listings-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload debug HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: |
            auto-alert/debug_*.html
            auto-alert/scraper_output.log
          retention-days: 3
          if-no-files-found: ignore
