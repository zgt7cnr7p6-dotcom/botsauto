name: Auto Alert Scraper

on:
  # Scheduling via cron-job.org (elke 3 min, workflow_dispatch trigger)
  # GitHub's eigen cron is uitgeschakeld — cron-job.org is betrouwbaarder
  # en ondersteunt intervals < 5 min.
  workflow_dispatch:
    inputs:
      clear_db:
        description: 'Database wissen (volledige nieuwe scan — TRIGGERT ALERTS VOOR ALLE LISTINGS!)'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

defaults:
  run:
    working-directory: auto-alert

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: scraper-run
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Restore database from data-branch (durable)
        if: ${{ inputs.clear_db == false }}
        run: |
          git fetch origin db-data --depth=1 2>/dev/null || true
          if git show origin/db-data:auto-alert/listings.db > listings.db 2>/dev/null; then
            echo "DB hersteld van db-data ($(stat -c%s listings.db 2>/dev/null || echo '?') bytes)"
          else
            echo "Geen db-data branch (verse start)"
            rm -f listings.db
          fi

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py 2>&1 | tee scraper_output.log

      - name: Post log summary as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f scraper_output.log ]; then
            SUMMARY=$(tail -200 scraper_output.log | head -c 60000)
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
              -f body="### Run #${{ github.run_number }} — $(date -u +'%Y-%m-%d %H:%M UTC')
          \`\`\`
          ${SUMMARY}
          \`\`\`"
          fi

      - name: Save database to data-branch (durable)
        if: always()
        run: |
          if [ ! -f listings.db ]; then echo "geen db, niets op te slaan"; exit 0; fi
          cd "$GITHUB_WORKSPACE"
          git config user.name "botsauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B db-data
          git add -f auto-alert/listings.db
          if git diff --cached --quiet; then
            echo "geen db-wijziging"
          else
            git commit -q -m "db snapshot run ${{ github.run_number }}"
            git push -f origin db-data && echo "DB opgeslagen naar db-data"
          fi

      - name: Upload debug HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: |
            auto-alert/debug_*.html
            auto-alert/scraper_output.log
          retention-days: 3
          if-no-files-found: ignore
