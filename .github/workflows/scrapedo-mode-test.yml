name: Scrape.do Mode Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Modes vergelijken
        env:
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          from bs4 import BeautifulSoup

          TOKEN = os.environ["SCRAPE_DO_TOKEN"]
          URL = ("https://suchen.mobile.de/fahrzeuge/search.html?dam=0&fe=PANORAMIC_GLASS_ROOF"
                 "&fr=1-2021%3A12-2024&ft=HYBRID&isSearchRequest=true&ml=%3A100000&ms=1900%3B37"
                 "&od=down&ref=ess&refId=117122289775784&s=Car&sb=doc&ssid=117122289775784&vc=Car")

          def cards(html):
              s = BeautifulSoup(html, "html.parser")
              c = s.select("a[data-testid*='result'], a[data-testid*='listing']")
              if not c: c = s.select("a.result-item, div.cBox-body--resultitem")
              if not c: c = s.select("a[href*='/fahrzeuge/details']")
              return len(c), (s.title.text[:60] if s.title else "")

          MODES = [
              ("basis (geen super/render)",        {},                                    1),
              ("basis + geoCode=de",               {"geoCode": "de"},                     1),
              ("render (geen super)",              {"render": "true"},                    5),
              ("super + geoCode=de  [HUIDIG]",     {"super": "true", "geoCode": "de"},   10),
          ]

          print(f"{'MODE':<32} {'CR':>3} {'HTTP':>5} {'KB':>7} {'AUTOS':>6}  TITEL")
          print("-" * 95)
          for name, extra, cr in MODES:
              params = {"token": TOKEN, "url": URL, **extra}
              try:
                  r = requests.get("https://api.scrape.do", params=params, timeout=90)
                  n, title = cards(r.text) if r.status_code == 200 else (0, "")
                  print(f"{name:<32} {cr:>3} {r.status_code:>5} {len(r.content)//1024:>7} {n:>6}  {title}")
                  if r.status_code != 200:
                      print(f"    >> FOUTMELDING: {r.text[:220]}")
              except Exception as e:
                  print(f"{name:<32} {cr:>3} {'ERR':>5} {'-':>7} {'-':>6}  {e}")
          PY
