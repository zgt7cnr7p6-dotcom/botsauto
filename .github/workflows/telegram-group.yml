name: Telegram Group Setup
on:
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Groeps-id vinden + bevestigen
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          upd=$(curl -s "https://api.telegram.org/bot${TOKEN}/getUpdates")
          # pak alle groeps-chats (id < 0) uit de recente updates
          ids=$(echo "$upd" | grep -oE '"chat":\{"id":-[0-9]+' | grep -oE '\-[0-9]+' | sort -u)
          if [ -z "$ids" ]; then
            echo "GEEN_GROEP_GEVONDEN — stuur een bericht in de groep en run opnieuw"
            echo "$upd" | head -c 300
            exit 1
          fi
          echo "GEVONDEN_GROEPEN: $ids"
          n=$(echo "$ids" | wc -l | tr -d ' ')
          if [ "$n" = "1" ]; then
            gid=$(echo "$ids" | head -1)
            resp=$(curl -s "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${gid}" \
              --data-urlencode "text=✅ Deze groep is nu het doel van de auto-alerts (setup-check).")
            echo "$resp" | grep -q '"ok":true' && echo "BEVESTIGING_VERSTUURD naar $gid" || echo "BEVESTIGING_MISLUKT: $resp"
          fi
