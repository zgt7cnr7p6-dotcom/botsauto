name: Auto Alert Scraper

on:
  schedule:
    - cron: '*/5 7-18 * * *'
  workflow_dispatch:
    inputs:
      clear_db:
        description: 'Database wissen (volledige nieuwe scan)'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Restore database from cache
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clear_db == false) }}
        uses: actions/cache/restore@v4
        with:
          path: listings.db
          key: listings-db-dummy
          restore-keys: |
            listings-db-

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: python scraper.py

      - name: Save database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload debug HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: debug_*.html
          retention-days: 3
          if-no-files-found: ignore
